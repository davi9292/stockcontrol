<svg xmlns="http://www.w3.org/2000/svg" width="3080" height="3020" viewBox="0 0 3080 3020">
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#20313F}.muted{fill:#647784}.small{font-size:14px}.body{font-size:16px}.label{font-size:14px;font-weight:600}.title{font-size:32px;font-weight:700}.h2{font-size:22px;font-weight:700}.buttonText{font-size:14px;font-weight:600;fill:#fff}.outlineText{font-size:14px;font-weight:600;fill:#145A8D}.white{fill:#fff}.primary{fill:#145A8D}.teal{fill:#18A6A6}.border{stroke:#DCE4E9}.card{fill:#fff;stroke:#DCE4E9;stroke-width:1.5}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17384d" flood-opacity=".10"/></filter>
    <g id="brand">
      <rect width="205" height="51" rx="7" fill="#fff"/>
      <g fill="none" stroke="#145A8D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(10 8) scale(.55)">
        <path d="M8 19 30 8l22 11-22 11L8 19Z" fill="#18A6A6"/><path d="M8 19v25l22 12V30M52 19v25L30 56M30 30v26M19 13l22 12"/>
      </g>
      <text x="53" y="32" font-size="20" font-weight="700" fill="#145A8D">StockControl</text>
    </g>
    <g id="nav">
      <rect width="1440" height="76" fill="#145A8D"/><use href="#brand" x="120" y="12"/>
      <text x="350" y="45" font-size="15" fill="#fff">Novo produto</text><text x="1080" y="45" font-size="15" fill="#fff">Olá, Ana Administradora</text>
      <rect x="1265" y="20" width="70" height="36" rx="6" fill="none" stroke="#fff"/><text x="1287" y="43" class="buttonText">Sair</text>
    </g>
    <g id="field">
      <rect width="520" height="48" rx="6" fill="#fff" stroke="#DCE4E9" stroke-width="1.5"/>
    </g>
  </defs>
  <rect width="3080" height="3020" fill="#E9EFF3"/>
  <text x="50" y="42" font-size="24" font-weight="700" fill="#145A8D">StockControl · Wireframes de alta fidelidade</text>
  <text x="2760" y="42" class="small muted">Inter · desktop 1440 px</text>

  <!-- Login -->
  <g transform="translate(50 70)">
    <text x="0" y="-12" class="label muted">01 · LOGIN</text>
    <rect width="1440" height="900" rx="12" fill="#F3F6F8"/>
    <g transform="translate(490 175)">
      <rect width="460" height="550" rx="14" fill="#fff" stroke="#DCE4E9" class="shadow"/>
      <g transform="translate(48 42) scale(1.2)"><use href="#brand"/></g>
      <text x="48" y="170" class="h2">Acesse sua conta</text><text x="48" y="202" class="body muted">Entre para consultar o estoque.</text>
      <text x="48" y="257" class="label">E-mail</text><g transform="translate(48 272)"><use href="#field"/><text x="16" y="30" class="body muted">nome@empresa.com</text></g>
      <text x="48" y="357" class="label">Senha</text><g transform="translate(48 372)"><use href="#field"/><text x="16" y="30" class="body muted">••••••••••</text></g>
      <rect x="48" y="452" width="364" height="48" rx="6" fill="#145A8D"/><text x="209" y="482" class="buttonText">Entrar</text>
    </g>
  </g>

  <!-- Produtos -->
  <g transform="translate(1590 70)">
    <text x="0" y="-12" class="label muted">02 · LISTAGEM DE PRODUTOS</text>
    <rect width="1440" height="900" rx="12" fill="#F3F6F8"/><use href="#nav"/>
    <text x="120" y="144" class="small teal" font-weight="700" letter-spacing="2">ESTOQUE</text><text x="120" y="190" class="title">Produtos</text>
    <rect x="1150" y="122" width="170" height="48" rx="7" fill="#145A8D"/><text x="1171" y="152" class="buttonText">+ Novo produto</text>
    <g transform="translate(120 220)">
      <g><rect width="375" height="600" rx="14" class="card shadow"/><rect width="375" height="190" rx="14" fill="#DCE9EF"/><path d="M0 176h375v14H0" fill="#DCE9EF"/><text x="150" y="105" class="body muted">Imagem do produto</text><text x="24" y="232" class="h2">Teclado USB</text><rect x="297" y="209" width="56" height="25" rx="12" fill="#DDF2E6"/><text x="306" y="227" class="small" fill="#198754">Ativo</text><text x="24" y="270" class="body muted">Teclado ABNT2 com conexão USB.</text><path d="M24 300h327" stroke="#DCE4E9"/><text x="24" y="332" class="small muted">QUANTIDADE</text><text x="24" y="359" class="body" font-weight="700">18 un.</text><text x="195" y="332" class="small muted">PREÇO</text><text x="195" y="359" class="body" font-weight="700">R$ 89,90</text><rect x="24" y="395" width="104" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="41" y="419" class="outlineText">Comentários</text><rect x="137" y="395" width="86" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="150" y="419" class="outlineText">Histórico</text><rect x="232" y="395" width="115" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="250" y="419" class="outlineText">Movimentar</text><rect x="24" y="447" width="75" height="38" rx="6" fill="#fff" stroke="#9AAAB4"/><text x="41" y="471" class="small" font-weight="600">Editar</text><rect x="108" y="447" width="82" height="38" rx="6" fill="#fff" stroke="#DC3545"/><text x="126" y="471" class="small" fill="#DC3545" font-weight="600">Excluir</text></g>
      <g transform="translate(400 0)"><rect width="375" height="600" rx="14" class="card shadow"/><rect width="375" height="190" rx="14" fill="#E8E6DF"/><text x="150" y="105" class="body muted">Imagem do produto</text><text x="24" y="232" class="h2">Mouse Óptico</text><rect x="297" y="209" width="56" height="25" rx="12" fill="#DDF2E6"/><text x="306" y="227" class="small" fill="#198754">Ativo</text><text x="24" y="270" class="body muted">Mouse óptico USB com três botões.</text><path d="M24 300h327" stroke="#DCE4E9"/><text x="24" y="332" class="small muted">QUANTIDADE</text><text x="24" y="359" class="body" font-weight="700">32 un.</text><text x="195" y="332" class="small muted">PREÇO</text><text x="195" y="359" class="body" font-weight="700">R$ 49,90</text><rect x="24" y="395" width="104" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="41" y="419" class="outlineText">Comentários</text><rect x="137" y="395" width="86" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="150" y="419" class="outlineText">Histórico</text><rect x="232" y="395" width="115" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="250" y="419" class="outlineText">Movimentar</text></g>
      <g transform="translate(800 0)"><rect width="375" height="600" rx="14" class="card shadow"/><rect width="375" height="190" rx="14" fill="#E6EAF4"/><text x="150" y="105" class="body muted">Imagem do produto</text><text x="24" y="232" class="h2">Monitor 24 polegadas</text><rect x="297" y="209" width="56" height="25" rx="12" fill="#DDF2E6"/><text x="306" y="227" class="small" fill="#198754">Ativo</text><text x="24" y="270" class="body muted">Monitor LED Full HD para escritório.</text><path d="M24 300h327" stroke="#DCE4E9"/><text x="24" y="332" class="small muted">QUANTIDADE</text><text x="24" y="359" class="body" font-weight="700">7 un.</text><text x="195" y="332" class="small muted">PREÇO</text><text x="195" y="359" class="body" font-weight="700">R$ 899,00</text><rect x="24" y="395" width="104" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="41" y="419" class="outlineText">Comentários</text><rect x="137" y="395" width="86" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="150" y="419" class="outlineText">Histórico</text><rect x="232" y="395" width="115" height="38" rx="6" fill="#fff" stroke="#145A8D"/><text x="250" y="419" class="outlineText">Movimentar</text></g>
    </g>
  </g>

  <!-- Comentários modal -->
  <g transform="translate(50 1030)">
    <text x="0" y="-12" class="label muted">03 · COMENTÁRIOS (MODAL SOBRE A LISTAGEM)</text>
    <rect width="1440" height="900" rx="12" fill="#F3F6F8"/><use href="#nav"/><text x="120" y="160" class="title">Produtos</text>
    <rect width="1440" height="900" rx="12" fill="#142632" opacity=".52"/>
    <g transform="translate(420 110)"><rect width="600" height="680" rx="14" fill="#fff" class="shadow"/><path d="M0 76h600" stroke="#DCE4E9"/><text x="28" y="43" class="h2">Comentários</text><text x="28" y="66" class="small muted">Teclado USB</text><text x="556" y="42" class="h2 muted">×</text>
      <g transform="translate(28 104)"><text x="0" y="0" class="body" font-weight="700">Bruno Usuário</text><rect x="123" y="-18" width="72" height="24" rx="12" fill="#EDF0F2"/><text x="136" y="-1" class="small muted">Usuário</text><text x="400" y="0" class="small muted">16/09/2026 10:12</text><text x="0" y="32" class="body">Teclas funcionando corretamente após conferência.</text><path d="M0 54h544" stroke="#DCE4E9"/></g>
      <g transform="translate(28 190)"><text x="0" y="0" class="body" font-weight="700">Ana Administradora</text><rect x="165" y="-18" width="110" height="24" rx="12" fill="#E4EEF5"/><text x="177" y="-1" class="small" fill="#145A8D">Administrador</text><text x="400" y="0" class="small muted">15/09/2026 08:40</text><text x="0" y="32" class="body">Produto conferido no recebimento do lote.</text><path d="M0 54h544" stroke="#DCE4E9"/></g>
      <rect x="28" y="570" width="150" height="44" rx="6" fill="#fff" stroke="#145A8D"/><text x="54" y="597" class="outlineText">Fechar</text><rect x="362" y="570" width="210" height="44" rx="6" fill="#145A8D"/><text x="388" y="597" class="buttonText">Adicionar comentário</text>
    </g>
  </g>

  <!-- Novo comentário -->
  <g transform="translate(1590 1030)">
    <text x="0" y="-12" class="label muted">04 · CADASTRO DE COMENTÁRIO</text>
    <rect width="1440" height="900" rx="12" fill="#F3F6F8"/><use href="#nav"/>
    <text x="120" y="130" class="body" fill="#145A8D">← Voltar para comentários</text><text x="120" y="190" class="small teal" font-weight="700" letter-spacing="2">PRODUTO</text><text x="120" y="234" class="title">Adicionar comentário</text><text x="120" y="268" class="body muted">Teclado USB</text>
    <g transform="translate(295 305)"><rect width="850" height="420" rx="14" class="card shadow"/><text x="32" y="58" class="label">Comentário</text><rect x="32" y="76" width="786" height="200" rx="6" fill="#fff" stroke="#DCE4E9"/><text x="52" y="110" class="body muted">Escreva uma observação sobre o produto...</text><rect x="636" y="328" width="115" height="44" rx="6" fill="#fff" stroke="#145A8D"/><text x="671" y="356" class="outlineText">Fechar</text><rect x="762" y="328" width="56" height="44" rx="6" fill="#145A8D"/><text x="774" y="356" class="buttonText">Cadastrar</text></g>
  </g>

  <!-- Novo produto -->
  <g transform="translate(1590 1980)">
    <text x="0" y="-12" class="label muted">05 · CADASTRO DE PRODUTO</text>
    <rect width="1440" height="1000" rx="12" fill="#F3F6F8"/><use href="#nav"/>
    <text x="120" y="130" class="body" fill="#145A8D">← Voltar para produtos</text><text x="120" y="190" class="small teal" font-weight="700" letter-spacing="2">CATÁLOGO</text><text x="120" y="234" class="title">Novo produto</text><text x="120" y="268" class="body muted">Preencha os dados para adicionar um item ao estoque.</text>
    <g transform="translate(295 300)"><rect width="850" height="620" rx="14" class="card shadow"/>
      <text x="32" y="52" class="label">Nome</text><rect x="32" y="66" width="510" height="48" rx="6" fill="#fff" stroke="#DCE4E9"/><text x="566" y="52" class="label">Status</text><rect x="566" y="66" width="252" height="48" rx="6" fill="#fff" stroke="#DCE4E9"/><text x="584" y="96" class="body">Ativo ▾</text>
      <text x="32" y="150" class="label">Descrição</text><rect x="32" y="164" width="786" height="100" rx="6" fill="#fff" stroke="#DCE4E9"/>
      <text x="32" y="300" class="label">Quantidade</text><rect x="32" y="314" width="245" height="48" rx="6" fill="#fff" stroke="#DCE4E9"/><text x="299" y="300" class="label">Preço (R$)</text><rect x="299" y="314" width="245" height="48" rx="6" fill="#fff" stroke="#DCE4E9"/><text x="566" y="300" class="label">Imagem</text><rect x="566" y="314" width="252" height="48" rx="6" fill="#fff" stroke="#DCE4E9"/><text x="580" y="344" class="small muted">Selecionar arquivo</text>
      <text x="32" y="396" class="label">Comentário inicial <tspan class="muted" font-weight="400">(opcional)</tspan></text><rect x="32" y="410" width="786" height="82" rx="6" fill="#fff" stroke="#DCE4E9"/>
      <rect x="636" y="540" width="115" height="44" rx="6" fill="#fff" stroke="#145A8D"/><text x="665" y="568" class="outlineText">Cancelar</text><rect x="762" y="540" width="56" height="44" rx="6" fill="#D8E0E5"/><text x="774" y="568" class="small" fill="#fff" font-weight="600">Cadastrar</text>
    </g>
  </g>
</svg>
